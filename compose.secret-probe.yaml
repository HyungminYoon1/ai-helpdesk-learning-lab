# Isolated synthetic experiment, not a deployment configuration.
# No network, published ports, database, scheduled Worker, or real credential.
x-probe: &probe
  image: ${HELPDESK_SECRET_PROBE_IMAGE:?experiment image required}
  pull_policy: never
  network_mode: none
  read_only: true
  user: "10001:10001"
  restart: "no"
  tmpfs:
    - /tmp
  volumes:
    - type: bind
      source: ./target/test-classes
      target: /opt/probe
      read_only: true
    - type: bind
      source: ${HELPDESK_SECRET_PROBE_EXPECTATION_DIR:?synthetic expectation directory required}
      target: /opt/probe-expectation
      read_only: true
  entrypoint:
    - java
    - -Dloader.main=experiment.helpdesk.secret.ComposeSecretMountExperiment
    - -Dloader.path=/opt/probe
    - -cp
    - /app/helpdesk.jar
    - org.springframework.boot.loader.launch.PropertiesLauncher
  command: ["${HELPDESK_SECRET_PROBE_CASE:?experiment case required}"]
  environment:
    SPRING_CONFIG_NAME: week8-secret-mount-probe
    SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    SPRING_PROFILES_ACTIVE: postgres
    HELPDESK_AI_PROVIDER_ENABLED: ${HELPDESK_SECRET_PROBE_ENABLED:?explicit feature flag required}
    # A fixed fixture value, not a runtime policy default.
    HELPDESK_AI_PROVIDER_MAX_SUMMARY_CODE_POINTS: "200"
    HELPDESK_AI_WORKER_ENABLED: "false"
    LOGGING_LEVEL_ROOT: "OFF"

services:
  probe:
    <<: *probe
    secrets:
      - source: synthetic_provider_key
        target: helpdesk.ai.provider.key
  probe-no-secret:
    <<: *probe

secrets:
  synthetic_provider_key:
    file: ${HELPDESK_SECRET_PROBE_KEY_FILE:?synthetic file required}
