<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Helpdesk 로그인</title>
    <script type="module" src="/cognito-page.mjs"></script>
</head>
<body>
    <main>
        <h1>Helpdesk 로그인</h1>
        <p id="login-status" role="status">로그인 단계를 확인하고 있습니다.</p>
        <form hidden id="start-login" method="post" action="/onboarding/start">
            <label>초대 코드 <input type="password" name="invite" maxlength="43" autocomplete="off"></label>
            <p>처음 초대받은 고객과 직원은 코드를 입력하세요. 기존 계정으로 로그인할 때는 비워두세요.</p>
            <button>로그인 시작</button>
        </form>
        <form hidden id="send-code" method="post" action="/onboarding/email-code">
            <button>이메일 확인 코드 보내기</button>
        </form>
        <form hidden id="verify-email" method="post" action="/onboarding/verify-email">
            <label>이메일 확인 코드
                <input type="password" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                    autocomplete="one-time-code" required>
            </label>
            <button>이메일 확인</button>
        </form>
        <form hidden id="reauthenticate" method="post" action="/onboarding/reauth">
            <button>인증 앱으로 다시 로그인</button>
        </form>
        <form hidden id="accept-invite" method="post" action="/onboarding/accept">
            <button>Helpdesk 계정 활성화</button>
        </form>
    </main>
</body>
</html>
