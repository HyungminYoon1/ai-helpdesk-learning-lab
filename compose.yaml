# 로컬 학습용 구성. Credential은 실행 시 Process Environment에서 전달한다.
services:
  db:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_DB: helpdesk_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HELPDESK_DB_ADMIN_PASSWORD:?DB admin password is required}
      HELPDESK_DB_APP_PASSWORD: ${HELPDESK_DB_APP_PASSWORD:?DB app password is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/001-local-app-role.sql:/docker-entrypoint-initdb.d/001-local-app-role.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "helpdesk_app", "-d", "helpdesk_local"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"
    # DB는 Compose Network 안에서만 연결한다. Host Port를 게시하지 않는다.

  app:
    image: ${HELPDESK_LOCAL_IMAGE:-helpdesk:week8-build-baseline}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres,local-browser
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/helpdesk_local
      SPRING_DATASOURCE_USERNAME: helpdesk_app
      SPRING_DATASOURCE_PASSWORD: ${HELPDESK_DB_APP_PASSWORD:?DB app password is required}
      HELPDESK_LOCAL_USER_USERNAME: ${HELPDESK_LOCAL_USER_USERNAME:?Local USER username is required}
      HELPDESK_LOCAL_USER_PASSWORD: ${HELPDESK_LOCAL_USER_PASSWORD:?Local USER password is required}
      HELPDESK_LOCAL_AGENT_USERNAME: ${HELPDESK_LOCAL_AGENT_USERNAME:?Local AGENT username is required}
      HELPDESK_LOCAL_AGENT_PASSWORD: ${HELPDESK_LOCAL_AGENT_PASSWORD:?Local AGENT password is required}
      HELPDESK_LOCAL_CORS_ALLOWED_ORIGIN: ${HELPDESK_LOCAL_CORS_ALLOWED_ORIGIN:-http://127.0.0.1:4173}
      HELPDESK_AI_WORKER_ENABLED: "false"
    ports:
      - target: 8080
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
